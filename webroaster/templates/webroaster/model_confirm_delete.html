{% extends "webroaster/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="topbar">
    <div>
        <h1>{{ title }}</h1>
    </div>
</div>

<div class="panel">
    <p><strong>{{ object }}</strong></p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button class="btn danger" type="submit">Delete</button>
            <a class="btn" href="{% url 'webroaster:list' model_name %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
